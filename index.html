<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>책책책 책좀 읽읍시다</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <img id="app-logo" src="assets/logo.png" alt="책책책 책좀 읽읍시다" class="logo-hidden" />
  <input id="upload-file-input" class="native-upload-input" type="file" accept="audio/*" />

  <section id="screen-splash" class="screen active">
    <div id="splash-guide" class="splash-guide"></div>
  </section>

  <section id="screen-main" class="screen">
    <header class="app-titlebar">
      <span class="app-titlebar-title">책 쫌 읽읍시다</span>
      <button type="button" class="app-titlebar-help" aria-label="도움말">?</button>
    </header>
    <div class="main-layout">
      <aside class="main-left" aria-label="월별 독서 목록">
        <div id="book-slider" class="book-slider"></div>
      </aside>
      <main id="month-detail" class="month-detail" aria-live="polite"></main>
      <button type="button" id="panel-scroll-up" class="scroll-arrow-btn scroll-arrow-up scroll-arrow-panel" aria-label="위로 스크롤">▲</button>
      <button type="button" id="panel-scroll-down" class="scroll-arrow-btn scroll-arrow-down scroll-arrow-panel" aria-label="아래로 스크롤">▼</button>
    </div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
